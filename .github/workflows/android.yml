
name: Android APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 17 para las herramientas actuales del Android SDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Java 11 para Gradle 5.6.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Compilar
        run: |
          unzip -q CODIGO_FUENTE.zip -d fuente

          G=$(find fuente -path '*misc/android/gradlew' | head -1)

          if [ -z "$G" ]; then
            echo "ERROR: No se encontró gradlew"
            exit 1
          fi

          cd "$(dirname "$G")"

          chmod +x gradlew

          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ClassiEmicx-apk
          path: fuente/**/app/build/outputs/apk/debug/*.apk
